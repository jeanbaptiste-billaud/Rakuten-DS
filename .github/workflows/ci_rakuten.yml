name: MLOps CI Pipeline

# Déclencheurs : Push sur main/master et dev ou lors d'une Pull Request
on:
  push:
    branches: [ "main", "master", "dev" ]
  pull_request:
    branches: [ "main", "master", "dev" ]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    
    steps:
    # 1. Récupérer le code du repo
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. Installer Python
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12' # Adapte selon ta version (3.8, 3.10...)
        cache: 'pip' # Active le cache pour accélérer les installations futures

    # 3. Installer les dépendances
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f tests/requirements.txt ]; then pip install -r tests/requirements.txt; fi
        # On installe les outils de test (s'ils ne sont pas dans requirements.txt)
        pip install pytest pytest-cov flake8

    # 4. (Optionnel) Linting - Vérifie la propreté du code
    - name: Lint with Flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    # 5. Lancer les tests unitaires
    - name: Run Unit Tests with Pytest
      id: run_tests
      continue-on-error: true
      run: |
        # Lancer les tests et afficher la couverture si besoin
        export PYTHONPATH=$PYTHONPATH:.
        pytest src/tests/ --doctest-modules --junitxml=junit/test-results.xml

    - name: Résultat des tests
      if: steps.run_tests.outcome == 'failure'
      run: echo "⚠️ ATTENTION - Les tests ont échoué, mais on ne bloque pas le pipeline."
