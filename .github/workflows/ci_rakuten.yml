name: Rakuten CI

on:
  workflow_dispatch:
  push:
    branches:
      - infra
      - text_classif
      - images_classif
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: .
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-cov
          if [[ -f src/tests/requirements.txt ]]; then
            python -m pip install -r src/tests/requirements.txt
          fi

      - name: Check Python syntax
        shell: bash
        run: |
          set -euo pipefail
          paths=()
          [[ -d src ]] && paths+=(src)
          [[ -d rakuten_vision ]] && paths+=(rakuten_vision)
          if (( ${#paths[@]} )); then
            python -m compileall -q "${paths[@]}"
          fi

      - name: Run unit tests
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$(find src/tests -type f -name 'test_*.py' -print -quit 2>/dev/null)" ]]; then
            pytest src/tests/ \
              --ignore=src/tests/services/mlflow_writing_test.py \
              --doctest-modules \
              --junitxml=junit/test-results.xml
          else
            echo "No pytest suite found on this branch; syntax checks completed."
          fi

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results-${{ github.run_id }}
          path: junit/test-results.xml
          if-no-files-found: ignore
          retention-days: 14
