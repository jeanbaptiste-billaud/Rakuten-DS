x-mlflow-common: &mlflow-common
  image: mlflow:${MLFLOW_VERSION}
  env_file:
    - ${ENV_FILE_PATH:-.env}
  environment: &mlflow-common-env
    AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
    AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
    MLFLOW_S3_ENDPOINT_URL: http://${MINIO_HOST}:${MINIO_PORT}
    MLFLOW_DEFAULT_ARTIFACT_ROOT: s3://${MINIO_MLFLOW_BUCKET}/

  depends_on:
    &mlflow-common-depends-on
    postgres:
      condition: service_healthy
    minio:
      condition: service_healthy

services:
  postgres: # ne pas modifier le nom
    image: postgres:15
    container_name: mlflow-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ../data/pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio: # ne pas modifier le nom
    image: minio/minio:${MINIO_VERSION}
    container_name: minio-S3-storage
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - ../data/minio-data:/data
      - ../data:/mnt/data
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${MINIO_PORT}/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio-client: # ne pas modifier le nom
    build:
      context: ..
      dockerfile: dockerfiles/minio-client/Dockerfile
      args:
        - VERSION=${MC_VERSION}
    image: minio-client:${MC_VERSION}
    container_name: minio-client
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - ../data:/mnt/data
#    entrypoint: >
#      /bin/sh -c '
#      mc alias set myminio http://${MINIO_HOST}:${MINIO_PORT} \
#        ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD} &&
#      mc mb --ignore-existing myminio/${MINIO_MLFLOW_BUCKET:-mlflow} &&
#      mc mb myminio/raw &&
#      mc mb myminio/dataset &&
#      mc mb myminio/preprocessed &&
#      mc cp /mnt/data/raw/all_raw_data.csv myminio/raw/all_raw_data.csv &&
#      mc mirror --overwrite  /mnt/data/dataset myminio/dataset &&
#      mc mirror --overwrite  /mnt/data/preprocessed myminio/preprocessed
#      '
    command: "/init/init.sh ; tail -f /dev/null"
    tty: true

  # =========================================================
  # 🧠 MLflow Tracking Server (UI + REST API)
  # =========================================================
  mlflow-server:
    build:
      context: ..
      dockerfile: ./dockerfiles/mlfow/Dockerfile
      args:
        - VERSION=${MLFLOW_VERSION}
    image: mlflow:${MLFLOW_VERSION}
    container_name: mlflow-server
    env_file:
      - ${ENV_FILE_PATH:-.env}
    depends_on:
      <<: *mlflow-common-depends-on
    ports:
      - "5000:5000"
    environment:
      <<: *mlflow-common-env
      # --- tracking backend ---
      MLFLOW_BACKEND_STORE_URI: "${MLFLOW_BACKEND_STORE_URI}"
      # --- lien vers le serveur d’artefacts ---
      MLFLOW_ARTIFACT_URI: "http://mlflow-artifacts:5000"
      # --- configuration de MLflow ---
      MLFLOW_HOST: "${MLFLOW_HOST}"
      MLFLOW_PORT: "${MLFLOW_PORT}"
    command: >
      mlflow server
      --backend-store-uri ${MLFLOW_BACKEND_STORE_URI}
      --host ${MLFLOW_HOST}
      --port ${MLFLOW_PORT}
      --default-artifact-root s3://${MINIO_MLFLOW_BUCKET}/
      --allowed-hosts "localhost, *"

  # =========================================================
  # 📦 MLflow Artifact Server (S3/MinIO backend)
  # =========================================================
  mlflow-artifacts:
    <<: *mlflow-common
    container_name: mlflow-artifacts
    depends_on:
      <<: *mlflow-common-depends-on
    ports:
      - "5001:5000"  # port interne 5000, exposé en 5001 sur ta machine
    environment:
      <<: *mlflow-common-env
    command: >
      mlflow server 
        --artifacts-only 
        --artifacts-destination s3://${MINIO_MLFLOW_BUCKET}/ 
        --host ${MLFLOW_HOST}
        --port ${MLFLOW_PORT}

  # ========================================
  # 🆕 SERVICE DRIFT DETECTOR
  # ========================================
  drift-detector:
    build:
      context: ../dockerfiles/drift-detector
      dockerfile: Dockerfile
    image: evidently:v0.4.33
    container_name: drift-detector
    ports:
      - "8003:8003"
    volumes:
      - ../drift_reports:/app/drift_reports
      - ../logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 30s
      timeout: 10s
      retries: 3

# ===============================================================
#  SERVICES à extraire du compose et à appeler via un dag aiflow
# ===============================================================

  # ========================================
  # SERVICE TRAINING (avec drift detection)
  # ========================================
  training:
    build:
      context: ..
      dockerfile: ./dockerfiles/trainer/Dockerfile
    image: sklearn:v1.7.2
    container_name: rakuten-model_trainer
    user: "1000:1000"
    working_dir: /workspace
    volumes:
      - ../src:/workspace/src
      - ../data:/workspace/data
      - ../models:/workspace/models
    environment:
      - PYTHONPATH=/workspace
      - PYTHONUNBUFFERED=1
      - MLFLOW_TRACKING_URI=http://mlflow-server:${MLFLOW_PORT}
      - MLFLOW_S3_ENDPOINT_URL=http://${MINIO_HOST}:${MINIO_PORT}
      - AWS_ACCESS_KEY_ID=${MINIO_ROOT_USER}
      - AWS_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD}
      - DRIFT_DETECTOR_URL=http://drift-detector:8003
      - GIT_PYTHON_REFRESH=quiet
    depends_on:
      - mlflow-server
      - drift-detector
    command: tail -f /dev/null  # pour garder le conteneur en vie
    tty: true

  # ========================================
  # SERVICE data (preprocessing etc.)
  # ========================================
  data:
    build:
      context: ..
      dockerfile: dockerfiles/data/Dockerfile
    image: spacy:3.7.5
    user: "1000:1000"
    working_dir: /workspace
    environment:
      - PYTHONPATH=/workspace
      - PYTHONUNBUFFERED=1
      - MINIO_HOST=${MINIO_HOST}
      - MINIO_PORT=${MINIO_PORT}
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD}
    command: tail -f /dev/null  # pour garder le conteneur en vie
    tty: true

networks:
  default:
    name: mlflow-network

volumes:
  logs:
  drift_reports: