networks:
  default:
    name: mlflow-network

volumes:
  pgdata:
    name: pgdata
    external: true
  minio_data:
    name: minio_data
    external: true
  dvc_data:
    name: dvc_data
    external: true
  logs_and_reports:
    name: logs_and_reports
    external: true
  airflow_vol:
    name: airflow_vol
    external: false
