x-airflow-common:
  &airflow-common
  image: jbbillaud/rakuten:airflow-v3.1.3
  environment:
    &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres/${AIRFLOW_DB}
    AIRFLOW_CONN_POSTGRES_DEFAULT: "postgresql://<user>:<password>@postgres:5432/postgres"
    AIRFLOW__CORE__FERNET_KEY: ''
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: 'http://airflow-apiserver:8080/execution/'
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
    _PIP_ADDITIONAL_REQUIREMENTS: ${_PIP_ADDITIONAL_REQUIREMENTS:-}
    AIRFLOW_CONFIG: '/opt/airflow/config/airflow.cfg'
    WORKDIR: ${WORKDIR}
    AIRFLOW_UID: ${AIRFLOW_UID}
    DOCKER_GID: ${DOCKER_GID}
  volumes:
    - ${AIRFLOW_PROJ_DIR:-..}/dags:/opt/airflow/dags
    - ${AIRFLOW_PROJ_DIR:-..}/config:/opt/airflow/config
    - ${AIRFLOW_PROJ_DIR:-..}/plugins:/opt/airflow/plugins
    - ${AIRFLOW_PROJ_DIR:-..}/logs:/opt/airflow/logs
    - .:/opt/airflow/compose
    - /var/run/docker.sock:/var/run/docker.sock # indispensable pour exécuter des DockerOperators
  user: "${AIRFLOW_UID:-50000}:0"
  group_add:
    - ${DOCKER_GID:-1001}
  depends_on:
    &airflow-common-depends-on
    postgres:
      condition: service_healthy


services:
  # =========================================================
  # 🧠 Base de donnée de Postgres (MLflow + Airflow)
  # =========================================================
  postgres:
    image: postgres:17
    container_name: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${AIRFLOW_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init_db.sql:/docker-entrypoint-initdb.d/init_db.sql
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "$AIRFLOW_DB" ]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always

  # =========================================================
  # Stockage S3
  # =========================================================
  minio: # ne pas modifier le nom
    image: minio/minio:${MINIO_VERSION}
    container_name: minio-S3-storage
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:${MINIO_PORT}/minio/health/live" ]
      interval: 5s
      timeout: 3s
      retries: 20

  # =========================================================
  # 🧠 MLflow Tracking Server (UI + REST API)
  # =========================================================
  mlflow-server:
    image: jbbillaud/rakuten:mlflow-${MLFLOW_VERSION:-v3.8.1}
    container_name: mlflow-server
    env_file:
      - ${ENV_FILE_PATH:-.env}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "5000:5000"
    environment:
      # --- tracking backend ---
      MLFLOW_BACKEND_STORE_URI: "${MLFLOW_BACKEND_STORE_URI}"
      # --- Configuration serveur d’artefacts ---
      MLFLOW_ARTIFACT_URI: "http://mlflow-artifacts:5000"
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      MLFLOW_S3_ENDPOINT_URL: http://${MINIO_HOST}:${MINIO_PORT}
      # --- configuration de MLflow ---
      MLFLOW_HOST: "${MLFLOW_HOST}"
      MLFLOW_PORT: "${MLFLOW_PORT}"
    command: >
      mlflow server
      --backend-store-uri ${MLFLOW_BACKEND_STORE_URI}
      --host ${MLFLOW_HOST}
      --port ${MLFLOW_PORT}
      --default-artifact-root s3://${MINIO_MLFLOW_BUCKET}/
      --allowed-hosts "localhost:5000, *"


  # ========================================
  # 🆕 SERVICE DRIFT DETECTOR
  # ========================================
  drift-detector:
    image: jbbillaud/rakuten:evidently-v0.7.20
    container_name: drift-detector
    ports:
      - "8003:8003"
    environment:
      - MODEL_SERVING_URL=http://model-serving:8002
    volumes:
      - logs_and_reports:/app/drift_reports/
      - logs_and_reports:/app/logs/
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8003/health" ]
      interval: 30s
      timeout: 10s
      retries: 3


  # =====================================================================
  # 🟦 PROMETHEUS (Monitoring)
  # =====================================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    depends_on:
      - mlflow-server
    networks:
      - default

  # =====================================================================
  # 🟩 GRAFANA (Dashboards)
  # =====================================================================
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_AUTH_DISABLE_LOGIN_FORM=true
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    volumes:
      - ../monitoring/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
    networks:
      - default

  # =====================================================================
  # 🛠️ MODEL-BUILDER (API de prédiction)
  # =====================================================================
  #  model-builder:
  #    image: jbbillaud/rakuten:bentoml-v1.4.30
  #    container_name: model-builder
  #    volumes:
  #      - /var/run/docker.sock.raw:/var/run/docker.sock
  #    environment:
  #      - PYTHONUNBUFFERED=1
  #      - AWS_ACCESS_KEY_ID=${MINIO_ROOT_USER}
  #      - AWS_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD}
  #      - MLFLOW_S3_ENDPOINT_URL=http://${MINIO_HOST}:${MINIO_PORT}
  #      - MLFLOW_TRACKING_URI=http://mlflow-server:${MLFLOW_PORT}
  #      - MLFLOW_S3_ENDPOINT_URL=http://${MINIO_HOST}:${MINIO_PORT}
  #      - MLFLOW_RUN_ID=1ae0352ce67c41dab8cad9adbc0f656f
  #    depends_on:
  #      - mlflow-server
  #      - minio
  #    networks:
  #      - default
  #    command: tail -f /dev/null  # pour garder le conteneur en vie
  #    tty: true

  # =====================================================================
  # 🟦 MODEL-SERVING (API de prédiction) A finaliser
  # =====================================================================
  model-serving:
    image: jbbillaud/rakuten:text-model-latest
    container_name: model-serving
    ports:
      - "${MODEL_PORT}:${MODEL_PORT}"
    environment:
      - BENTOML_PORT=${MODEL_PORT}
      - BENTOML_HOST=${MODEL_HOST}
      - MODEL_PATH=/app/models/SVM/model.pkl
    volumes:
      - ../../models:/app/models:ro
      - logs_and_reports:/logs_and_reports
    #      command: >
    #      ln -sfn /logs_and_reports/logs/model-serving /app/logs/model-serving
    restart: unless-stopped
    networks:
      - default


  #   =====================================================================
  #   🟧 API GATEWAY (point d'entrée – orchestrateur des services)
  #   =====================================================================
  api-gateway:
    image: jbbillaud/rakuten:fastapi-v0.128.0
    container_name: api-gateway
    ports:
      - "8000:8000"
    restart: unless-stopped
    networks:
      - default

      
  # =========================================================
  # 🔐 AUTH SERVICE (mini-service d'authentification)
  # =========================================================
  auth-service:
    image: jbbillaud/rakuten:authentification
    container_name: auth-service
    networks:
      - default

  # =========================================================
  # 🌐 REVERSE PROXY (point d'entrée sécurisé)
  # =========================================================
  reverse-proxy:
    image: jbbillaud/rakuten:nginx-v3.23
    container_name: reverse-proxy
    ports:
      - "8085:80"
    volumes:
      - ../../docker/reverse-proxy/droits.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - auth-service
      - drift-detector
    networks:
      - default


  streamlit-dashboard:
    image: jbbillaud/rakuten:streamlit-v1.29.0
    container_name: streamlit-dashboard
    ports:
      - "8501:8501"
    volumes:
      - ../streamlit/.streamlit:/root/.streamlit
      - ../streamlit/app.py:/app/app.py
      - ../streamlit/pages:/app/pages
    environment:
      - PYTHONUNBUFFERED=1
    depends_on:
      - mlflow-server
      - grafana
      - prometheus
      - airflow-apiserver
      - drift-detector
      - model-serving
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "--fail", "http://localhost:8501/_stcore/health" ]
      interval: 30s
      timeout: 10s
      retries: 3

  # =========================================================
  #  Airflow orchestration
  # =========================================================
  airflow-dag-processor:
    <<: *airflow-common
    container_name: airflow-dag-processor
    command: dag-processor
    healthcheck:
      test: [ "CMD-SHELL", 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"' ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-apiserver:
    <<: *airflow-common
    container_name: airflow-apiserver
    command: api-server
    ports:
      - "8080:8080"
    healthcheck:
      test: [ "CMD", "curl", "--fail", "http://localhost:8080/api/v2/version" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow-scheduler
    command: scheduler
    healthcheck:
      test: [ "CMD", "curl", "--fail", "http://localhost:8974/health" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully


  airflow-init:
    <<: *airflow-common
    container_name: airflow-init
    entrypoint: /bin/bash
    # yamllint disable rule:line-length
    command:
      - -c
      - |
        if [[ -z "${AIRFLOW_UID}" ]]; then
          echo
          echo -e "\033[1;33mWARNING!!!: AIRFLOW_UID not set!\e[0m"
          echo "If you are on Linux, you SHOULD follow the instructions below to set "
          echo "AIRFLOW_UID environment variable, otherwise files will be owned by root."
          echo "For other operating systems you can get rid of the warning with manually created .env file:"
          echo "    See: https://airflow.apache.org/docs/apache-airflow/stable/howto/docker-compose/index.html#setting-the-right-airflow-user"
          echo
          export AIRFLOW_UID=$(id -u)
        fi
        one_meg=1048576
        mem_available=$$(($$(getconf _PHYS_PAGES) * $$(getconf PAGE_SIZE) / one_meg))
        cpus_available=$$(grep -cE 'cpu[0-9]+' /proc/stat)
        disk_available=$$(df / | tail -1 | awk '{print $$4}')
        warning_resources="false"
        if (( mem_available < 4000 )) ; then
          echo
          echo -e "\033[1;33mWARNING!!!: Not enough memory available for Docker.\e[0m"
          echo "At least 4GB of memory required. You have $$(numfmt --to iec $$((mem_available * one_meg)))"
          echo
          warning_resources="true"
        fi
        if (( cpus_available < 2 )); then
          echo
          echo -e "\033[1;33mWARNING!!!: Not enough CPUS available for Docker.\e[0m"
          echo "At least 2 CPUs recommended. You have $${cpus_available}"
          echo
          warning_resources="true"
        fi
        if (( disk_available < one_meg * 10 )); then
          echo
          echo -e "\033[1;33mWARNING!!!: Not enough Disk space available for Docker.\e[0m"
          echo "At least 10 GBs recommended. You have $$(numfmt --to iec $$((disk_available * 1024 )))"
          echo
          warning_resources="true"
        fi
        if [[ $${warning_resources} == "true" ]]; then
          echo
          echo -e "\033[1;33mWARNING!!!: You have not enough resources to run Airflow (see above)!\e[0m"
          echo "Please follow the instructions to increase amount of resources available:"
          echo "   https://airflow.apache.org/docs/apache-airflow/stable/howto/docker-compose/index.html#before-you-begin"
          echo
        fi
        echo
        echo "Creating missing opt dirs if missing:"
        echo
        mkdir -v -p /opt/airflow/{logs,dags,plugins,config}
        echo
        echo "Airflow version:"
        /entrypoint airflow version
        echo
        echo "Files in shared volumes:"
        echo
        ls -la /opt/airflow/{logs,dags,plugins,config}
        echo
        echo "Running airflow config list to create default config file if missing."
        echo
        /entrypoint airflow config list >/dev/null
        echo
        echo "Files in shared volumes:"
        echo
        ls -la /opt/airflow/{logs,dags,plugins,config}
        echo
        echo "Change ownership of files in /opt/airflow to ${AIRFLOW_UID}:0"
        echo
        chown -R "${AIRFLOW_UID}:0" /opt/airflow/
        echo
        echo "Change ownership of files in shared volumes to ${AIRFLOW_UID}:0"
        echo
        chown -v -R "${AIRFLOW_UID}:0" /opt/airflow/{logs,dags,plugins,config}
        echo
        echo "Files in shared volumes:"
        echo
        ls -la /opt/airflow/{logs,dags,plugins,config}

    # yamllint enable rule:line-length
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: ${_AIRFLOW_WWW_USER_USERNAME:-airflow}
      _AIRFLOW_WWW_USER_PASSWORD: ${_AIRFLOW_WWW_USER_PASSWORD:-airflow}
      _PIP_ADDITIONAL_REQUIREMENTS: ''
    user: "0:0"


