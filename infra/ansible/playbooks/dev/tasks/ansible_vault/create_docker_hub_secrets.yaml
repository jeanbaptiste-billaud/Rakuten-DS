# tasks/ansible_vault/create_docker_hub_secrets.yaml
---
# Une valeur saisie au prompt remplace l'existant. Une valeur vide conserve
# l'existant, sauf en mode force où le champ est volontairement remis à vide.
- name: Build dictionary for Docker Hub secrets
  ansible.builtin.set_fact:
    docker_hub_secret:
      docker_hub:
        username: >-
          {{
            vault_docker_hub_username
            if (vault_force_recreate | bool or vault_docker_hub_username | length > 0)
            else (docker_hub | default({})).username | default('')
          }}
        password: >-
          {{
            vault_docker_hub_password
            if (vault_force_recreate | bool or vault_docker_hub_password | length > 0)
            else (docker_hub | default({})).password | default('')
          }}
  no_log: true
