# tasks/ansible_vault/create_github_secrets.yaml
---
# La clé privée peut venir d'un fichier local. Si aucun chemin n'est fourni,
# on garde la clé existante pour éviter de l'effacer avec une chaîne vide.
- name: Read GitHub App private key if provided
  ansible.builtin.set_fact:
    prompted_github_app_private_key: >-
      {{ lookup('ansible.builtin.file', vault_github_private_key_path)
         if (vault_github_private_key_path | length > 0) else '' }}
  no_log: true

- name: Build dictionary for GitHub secrets
  ansible.builtin.set_fact:
    github_secret:
      github_app:
        repository: "{{ (github_app | default({})).repository | default('') }}"
        app_id: >-
          {{
            vault_github_app_id
            if (vault_force_recreate | bool or vault_github_app_id | length > 0)
            else (github_app | default({})).app_id | default('')
          }}
        client_id: >-
          {{
            vault_github_client_id
            if (vault_force_recreate | bool or vault_github_client_id | length > 0)
            else (github_app | default({})).client_id | default('')
          }}
        installation_id: >-
          {{
            vault_github_installation_id
            if (vault_force_recreate | bool or vault_github_installation_id | length > 0)
            else (github_app | default({})).installation_id | default('')
          }}
        private_key: >-
          {{
            prompted_github_app_private_key
            if (vault_force_recreate | bool or prompted_github_app_private_key | length > 0)
            else (github_app | default({})).private_key | default('')
          }}
  no_log: true
