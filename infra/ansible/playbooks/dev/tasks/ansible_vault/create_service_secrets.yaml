# tasks/ansible_vault/create_service_secrets.yaml
---
# Les services n'ont pas tous la même forme dans le vault:
# - minio utilise les noms d'environnement MINIO_ROOT_*
# - jenkins expose admin_user/admin_password
# - les autres gardent la forme simple user/password
- name: Read existing password for {{ service.name }}
  ansible.builtin.set_fact:
    existing_service_password: >-
      {{
        (minio | default({})).MINIO_ROOT_PASSWORD | default('')
        if service.name == 'minio'
        else (
          (jenkins | default({})).admin_password | default('')
          if service.name == 'jenkins'
          else ((lookup('ansible.builtin.vars', service.name, default={}) | default({})).password | default(''))
        )
      }}
  no_log: true

- name: Generate password for {{ service.name }}
  ansible.builtin.command:
    cmd: openssl rand -hex 32
  register: generated_password
  changed_when: true
  when:
    - vault_force_recreate | bool or existing_service_password | length == 0
  no_log: true

- name: Select password for {{ service.name }}
  ansible.builtin.set_fact:
    current_service_password: >-
      {{
        generated_password.stdout
        if (vault_force_recreate | bool or existing_service_password | length == 0)
        else existing_service_password
      }}
  no_log: true

- name: Build MinIO secret
  ansible.builtin.set_fact:
    current_service_secret:
      minio:
        MINIO_ROOT_USER: "{{ (minio | default({})).MINIO_ROOT_USER | default(service.user) }}"
        MINIO_ROOT_PASSWORD: "{{ current_service_password }}"
  when: service.name == "minio"
  no_log: true

- name: Build Jenkins secret
  ansible.builtin.set_fact:
    current_service_secret:
      jenkins:
        admin_user: "{{ (jenkins | default({})).admin_user | default(service.user) }}"
        admin_password: "{{ current_service_password }}"
  when: service.name == "jenkins"
  no_log: true

- name: Build generic service secret
  ansible.builtin.set_fact:
    current_service_secret: >-
      {{
        {
          service.name: {
            'user': ((lookup('ansible.builtin.vars', service.name, default={}) | default({})).user | default(service.user)),
            'password': current_service_password
          }
        }
      }}
  when: service.name not in ["minio", "jenkins"]
  no_log: true

- name: Accumulate service secret
  ansible.builtin.set_fact:
    services_secrets: >-
      {{
        services_secrets | default({})
        | combine(current_service_secret, recursive=True)
      }}
  no_log: true
