# tasks/ansible_vault/create_dagshub_secrets.yaml
---
# Une valeur saisie au prompt remplace l'existant. Une valeur vide conserve
# l'existant, sauf en mode force où le champ est volontairement remis à vide.
- name: Build dictionary for dagshub secrets
  ansible.builtin.set_fact:
    dagshub_secret:
      dagshub:
        user: >-
          {{
            vault_dagshub_user
            if (vault_force_recreate | bool or vault_dagshub_user | length > 0)
            else (dagshub | default({})).user | default('')
          }}
        password: >-
          {{
            vault_dagshub_password
            if (vault_force_recreate | bool or vault_dagshub_password | length > 0)
            else (dagshub | default({})).password | default('')
          }}
  no_log: true
