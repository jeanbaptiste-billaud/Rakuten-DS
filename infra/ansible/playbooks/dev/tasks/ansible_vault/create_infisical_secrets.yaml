# tasks/ansible_vault/create_infisical_secrets.yaml
---
- name: Read existing Infisical secrets
  ansible.builtin.set_fact:
    existing_infisical_encryption_key: "{{ (infisical | default({})).encryption_key | default('') }}"
    existing_infisical_auth_secret: "{{ (infisical | default({})).auth_secret | default('') }}"
    existing_infisical_admin_password: "{{ (infisical | default({})).bootstrap.admin_password | default('') }}"
  no_log: true

- name: Generate Infisical encryption key
  ansible.builtin.command:
    cmd: openssl rand -hex 16
  register: generated_infisical_encryption_key
  changed_when: true
  when:
    - vault_force_recreate | bool or existing_infisical_encryption_key | length == 0
  no_log: true

- name: Generate Infisical auth secret
  ansible.builtin.command:
    cmd: openssl rand -base64 32
  register: generated_infisical_auth_secret
  changed_when: true
  when:
    - vault_force_recreate | bool or existing_infisical_auth_secret | length == 0
  no_log: true

- name: Generate Infisical bootstrap admin password
  ansible.builtin.command:
    cmd: openssl rand -hex 32
  register: generated_infisical_admin_password
  changed_when: true
  when:
    - vault_force_recreate | bool or existing_infisical_admin_password | length == 0
  no_log: true

- name: Build Infisical service secrets
  ansible.builtin.set_fact:
    infisical_secret:
      infisical:
        encryption_key: >-
          {{
            generated_infisical_encryption_key.stdout
            if (vault_force_recreate | bool or existing_infisical_encryption_key | length == 0)
            else existing_infisical_encryption_key
          }}
        auth_secret: >-
          {{
            generated_infisical_auth_secret.stdout
            if (vault_force_recreate | bool or existing_infisical_auth_secret | length == 0)
            else existing_infisical_auth_secret
          }}
        site_url: "{{ (infisical | default({})).site_url | default(infisical_site_url | default('http://localhost:8080')) }}"
        redis_url: "{{ (infisical | default({})).redis_url | default(infisical_redis_url | default('redis://redis:6379')) }}"
        bootstrap:
          admin_email: "{{ (infisical | default({})).bootstrap.admin_email | default(infisical_admin_email | default('admin@rakuten.local')) }}"
          admin_password: >-
            {{
              generated_infisical_admin_password.stdout
              if (vault_force_recreate | bool or existing_infisical_admin_password | length == 0)
              else existing_infisical_admin_password
            }}
          organization_name: "{{ (infisical | default({})).bootstrap.organization_name | default(infisical_organization_name | default('Rakuten DS')) }}"
          project_name: "{{ (infisical | default({})).bootstrap.project_name | default(infisical_project_name | default('rakuten-ds')) }}"
          environment_slug: "{{ (infisical | default({})).bootstrap.environment_slug | default(infisical_environment_slug | default('dev')) }}"
          secret_path: "{{ (infisical | default({})).bootstrap.secret_path | default(infisical_secret_path | default('/')) }}"
  no_log: true
