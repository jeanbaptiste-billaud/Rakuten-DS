# tasks/ansible_vault/create_postgres_secrets.yaml
---
# Chaque entrée Postgres est stockée sous la clé racine "postgres".
# Exemple attendu par les playbooks: postgres.mlflow.password.
- name: Read existing postgres password for {{ postgres_service.name }}
  ansible.builtin.set_fact:
    existing_postgres_password: >-
      {{
        (
          (postgres | default({}))[postgres_service.name] | default({})
        ).password | default('')
      }}
  no_log: true

- name: Generate password for {{ postgres_service.name }}
  ansible.builtin.command:
    cmd: openssl rand -hex 32
  register: generated_password
  changed_when: true
  when:
    - vault_force_recreate | bool or existing_postgres_password | length == 0
  no_log: true

- name: Select postgres password for {{ postgres_service.name }}
  ansible.builtin.set_fact:
    current_postgres_password: >-
      {{
        generated_password.stdout
        if (vault_force_recreate | bool or existing_postgres_password | length == 0)
        else existing_postgres_password
      }}
  no_log: true

- name: Build postgres dictionary for {{ postgres_service.name }}
  ansible.builtin.set_fact:
    current_postgres_secret: >-
      {{
        {
          'postgres': {
            postgres_service.name: (
              {
                'user': postgres_service.user,
                'password': current_postgres_password
              }
              | combine(
                  {'db': postgres_service.db}
                  if postgres_service.db is defined else {}
                )
            )
          }
        }
      }}
  no_log: true

- name: Accumulate postgres secrets
  ansible.builtin.set_fact:
    postgres_secrets: >-
      {{
        postgres_secrets | default({})
        | combine(current_postgres_secret, recursive=True)
      }}
  no_log: true
