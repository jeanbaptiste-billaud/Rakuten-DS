---
- name: Initialize project Ansible Vault
  hosts: dev
  connection: local
  gather_facts: false

  vars:
    # Surchargeables avec -e si besoin.
    ansible_vault_password_file: "{{ lookup('ansible.builtin.config', 'DEFAULT_VAULT_PASSWORD_FILE') }}"

    # Par défaut, ce playbook complète le vault existant sans régénérer
    # les secrets déjà présents. Passe vault_force_recreate=true pour
    # volontairement remplacer toutes les valeurs gérées par ce playbook.
    vault_force_recreate: false

    postgres_services:
      - name: root
        user: postgres
      - name: admin
        user: postgres_admin
      - name: mlflow
        db: mlflow_db
        user: mlflow
      - name: airflow
        db: airflow_db
        user: airflow
      - name: jenkins
        db: jenkins_db
        user: jenkins
      - name: infisical
        db: infisical_db
        user: infisical

    services:
      - name: minio
        user: minio
      - name: mlflow
        user: mlflow
      - name: airflow
        user: airflow
      - name: jenkins
        user: admin

  vars_prompt:
    - name: vault_github_app_id
      prompt: "GitHub App ID (laisser vide si non configuré)"
      private: false
      default: ""

    - name: vault_github_client_id
      prompt: "GitHub App Client ID (laisser vide si non configuré)"
      private: false
      default: ""

    - name: vault_github_installation_id
      prompt: "GitHub App Installation ID (laisser vide si non configuré)"
      private: false
      default: ""

    - name: vault_github_private_key_path
      prompt: "Chemin local vers la clé privée GitHub App .pem (laisser vide si non configuré)"
      private: false
      default: ""

    - name: vault_dagshub_user
      prompt: "DagsHub user (laisser vide si non configuré)"
      private: false
      default: ""

    - name: vault_dagshub_password
      prompt: "DagsHub password/token (laisser vide si non configuré)"
      private: true
      default: ""

    - name: vault_docker_hub_username
      prompt: "Docker Hub username (laisser vide si non configuré)"
      private: false
      default: ""

    - name: vault_docker_hub_password
      prompt: "Docker Hub password/token (laisser vide si non configuré)"
      private: true
      default: ""

  tasks:
    - name: Create vault directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0700"
      loop:
        - "{{ ansible_vault_file | dirname }}"
        - "{{ ansible_vault_password_file | dirname }}"

    - name: Check vault password file
      ansible.builtin.stat:
        path: "{{ ansible_vault_password_file }}"
      register: vault_password_file_info

    - name: Generate vault password
      ansible.builtin.command:
        argv:
          - openssl
          - rand
          - -base64
          - "48"
      register: generated_vault_password
      changed_when: true
      when: not vault_password_file_info.stat.exists
      no_log: true

    - name: Write vault password file
      ansible.builtin.copy:
        dest: "{{ ansible_vault_password_file }}"
        content: "{{ generated_vault_password.stdout }}\n"
        mode: "0600"
      when: not vault_password_file_info.stat.exists
      no_log: true

    - name: Secure vault password file
      ansible.builtin.file:
        path: "{{ ansible_vault_password_file }}"
        mode: "0600"

    - name: Check existing vault file
      ansible.builtin.stat:
        path: "{{ ansible_vault_file }}"
      register: vault_file_info

    # On charge le fichier existant dans un dictionnaire dédié pour préserver
    # aussi les clés que ce playbook ne sait pas générer explicitement.
    - name: Load existing vault content
      ansible.builtin.include_vars:
        file: "{{ ansible_vault_file }}"
        name: existing_vault_content
      when:
        - vault_file_info.stat.exists
        - not (vault_force_recreate | bool)
      no_log: true

    # Si le vault existe, Ansible l'a déjà chargé via group_vars/all.
    # Les tâches incluses ci-dessous lisent donc les variables actuelles
    # et ne génèrent que ce qui manque, sauf en mode force.
    - name: Build services secrets
      ansible.builtin.include_tasks: tasks/ansible_vault/create_service_secrets.yaml
      loop: "{{ services }}"
      loop_control:
        loop_var: service

    - name: Build postgres service secrets
      ansible.builtin.include_tasks: tasks/ansible_vault/create_postgres_secrets.yaml
      loop: "{{ postgres_services }}"
      loop_control:
        loop_var: postgres_service

    - name: Build GitHub secrets
      ansible.builtin.include_tasks: tasks/ansible_vault/create_github_secrets.yaml

    - name: Build dagshub secrets
      ansible.builtin.include_tasks: tasks/ansible_vault/create_dagshub_secrets.yaml

    - name: Build Docker Hub secrets
      ansible.builtin.include_tasks: tasks/ansible_vault/create_docker_hub_secrets.yaml

    - name: Build Infisical secrets
      ansible.builtin.include_tasks: tasks/ansible_vault/create_infisical_secrets.yaml

    - name: Concat secrets
      ansible.builtin.set_fact:
        vault_content: >-
          {{
            existing_vault_content | default({})
            | combine(github_secret, recursive=True)
            | combine(dagshub_secret, recursive=True)
            | combine(docker_hub_secret, recursive=True)
            | combine(services_secrets, recursive=True)
            | combine(postgres_secrets, recursive=True)
            | combine(infisical_secret, recursive=True)
          }}
      no_log: true

    # Le fichier peut être déjà chiffré. On le remplace d'abord par le YAML
    # fusionné en clair, puis on chiffre immédiatement ce nouveau contenu.
    # Le template force github_app.private_key en bloc literal YAML pour
    # éviter que PyYAML ne réécrive le PEM en chaîne multilignes quotée.
    - name: Write plaintext vault YAML before encryption
      ansible.builtin.template:
        src: secrets.vault.yaml.j2
        dest: "{{ ansible_vault_file }}"
        mode: "0600"
      no_log: true

    - name: Encrypt vault YAML file
      ansible.builtin.command:
        argv:
          - ansible-vault
          - encrypt
          - --vault-password-file
          - "{{ ansible_vault_password_file }}"
          - "{{ ansible_vault_file }}"
      changed_when: true
      no_log: true

    - name: Show created files
      ansible.builtin.debug:
        msg:
          - "Vault créé : {{ ansible_vault_file }}"
          - "Mot de passe vault local : {{ ansible_vault_password_file }}"
          - "À ne jamais commiter : {{ ansible_vault_password_file }}"
