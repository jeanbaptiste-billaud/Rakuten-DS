---
- name: Ensure Podman network exists
  ansible.builtin.command:
    argv:
      - podman
      - network
      - ls
      - --format
      - "{% raw %}{{.Name}}{% endraw %}"
  register: infisical_networks
  changed_when: false
  failed_when: false

- name: Inspect postgres container
  ansible.builtin.command:
    argv:
      - podman
      - inspect
      - -f
      - "{% raw %}{{.State.Status}}{% endraw %}"
      - postgres
  register: infisical_postgres_container
  changed_when: false
  failed_when: false
  no_log: true

- name: Start existing postgres container
  ansible.builtin.command:
    argv:
      - podman
      - start
      - postgres
  when:
    - infisical_postgres_container.rc == 0
    - infisical_postgres_container.stdout | trim != "running"
  no_log: true

- name: Run postgres container if missing
  ansible.builtin.command:
    argv:
      - podman
      - run
      - -d
      - --name
      - postgres
      - --network
      - "{{ docker_network }}"
      - --network-alias
      - postgres
      - -v
      - "{{ docker_volumes.postgres }}:/var/lib/postgresql/data"
      - -e
      - POSTGRES_USER={{ postgres.root.user }}
      - -e
      - POSTGRES_PASSWORD={{ postgres.root.password }}
      - -e
      - POSTGRES_DB=postgres
      - "{{ docker_images.postgres.image }}"
  when: infisical_postgres_container.rc != 0
  no_log: true

- name: Wait for postgres to accept connections
  ansible.builtin.command:
    argv:
      - podman
      - exec
      - postgres
      - pg_isready
      - -U
      - "{{ postgres.root.user }}"
      - -d
      - postgres
  register: infisical_postgres_ready
  retries: 30
  delay: 2
  until: infisical_postgres_ready.rc == 0
  changed_when: false
  no_log: true

- name: Create Infisical postgres role
  ansible.builtin.command:
    argv:
      - podman
      - exec
      - postgres
      - psql
      - -U
      - "{{ postgres.root.user }}"
      - -d
      - postgres
      - -v
      - "ON_ERROR_STOP=1"
      - -c
      - >-
        DO $$
        BEGIN
          IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = '{{ postgres.infisical.user }}') THEN
            CREATE ROLE "{{ postgres.infisical.user }}" LOGIN PASSWORD '{{ postgres.infisical.password }}';
          ELSE
            ALTER ROLE "{{ postgres.infisical.user }}" WITH LOGIN PASSWORD '{{ postgres.infisical.password }}';
          END IF;
        END
        $$;
  changed_when: false
  no_log: true

- name: Check Infisical postgres database
  ansible.builtin.command:
    argv:
      - podman
      - exec
      - postgres
      - psql
      - -U
      - "{{ postgres.root.user }}"
      - -d
      - postgres
      - -tAc
      - "SELECT 1 FROM pg_database WHERE datname='{{ postgres.infisical.db }}'"
  register: infisical_database_exists
  changed_when: false
  no_log: true

- name: Create Infisical postgres database
  ansible.builtin.command:
    argv:
      - podman
      - exec
      - postgres
      - createdb
      - -U
      - "{{ postgres.root.user }}"
      - -O
      - "{{ postgres.infisical.user }}"
      - "{{ postgres.infisical.db }}"
  when: infisical_database_exists.stdout | trim != "1"
  no_log: true

- name: Inspect redis container
  ansible.builtin.command:
    argv:
      - podman
      - inspect
      - -f
      - "{% raw %}{{.State.Status}}{% endraw %}"
      - redis
  register: infisical_redis_container
  changed_when: false
  failed_when: false
  no_log: true

- name: Start existing redis container
  ansible.builtin.command:
    argv:
      - podman
      - start
      - redis
  when:
    - infisical_redis_container.rc == 0
    - infisical_redis_container.stdout | trim != "running"
  no_log: true

- name: Run redis container if missing
  ansible.builtin.command:
    argv:
      - podman
      - run
      - -d
      - --name
      - redis
      - --network
      - "{{ docker_network }}"
      - --network-alias
      - redis
      - -v
      - "{{ docker_volumes.redis }}:/data"
      - "{{ docker_images.redis.image }}"
      - redis-server
      - --appendonly
      - "yes"
  when: infisical_redis_container.rc != 0
  no_log: true

- name: Inspect Infisical container
  ansible.builtin.command:
    argv:
      - podman
      - inspect
      - -f
      - "{% raw %}{{.State.Status}}{% endraw %}"
      - infisical
  register: infisical_service_container
  changed_when: false
  failed_when: false
  no_log: true

- name: Start existing Infisical container
  ansible.builtin.command:
    argv:
      - podman
      - start
      - infisical
  when:
    - infisical_service_container.rc == 0
    - infisical_service_container.stdout | trim != "running"
  no_log: true

- name: Run Infisical container if missing
  ansible.builtin.command:
    argv:
      - podman
      - run
      - -d
      - --name
      - infisical
      - --network
      - "{{ docker_network }}"
      - --network-alias
      - infisical
      - -p
      - "8080:8080"
      - -e
      - ENCRYPTION_KEY={{ infisical.encryption_key }}
      - -e
      - AUTH_SECRET={{ infisical.auth_secret }}
      - -e
      - SITE_URL={{ infisical.site_url }}
      - -e
      - DB_CONNECTION_URI=postgresql://{{ postgres.infisical.user }}:{{ postgres.infisical.password }}@postgres:5432/{{ postgres.infisical.db }}
      - -e
      - REDIS_URL={{ infisical.redis_url }}
      - -e
      - NODE_ENV=production
      - "{{ docker_images.infisical.image }}"
  when: infisical_service_container.rc != 0
  no_log: true

- name: Wait for Infisical HTTP endpoint
  ansible.builtin.uri:
    url: "{{ infisical.site_url }}"
    method: GET
    status_code:
      - 200
      - 302
      - 404
  register: infisical_http_check
  retries: 60
  delay: 2
  until: infisical_http_check.status in [200, 302, 404]
  changed_when: false
