---
- name: Check Infisical CLI
  ansible.builtin.command:
    argv:
      - infisical
      - --version
  register: infisical_cli_version
  changed_when: false
  failed_when: false

- name: Install Infisical CLI apt prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present
    update_cache: true
  become: true
  when:
    - infisical_cli_version.rc != 0
    - ansible_facts.os_family | default('Debian') == "Debian"

- name: Download Infisical CLI apt repository setup
  ansible.builtin.get_url:
    url: https://dl.cloudsmith.io/public/infisical/infisical-cli/setup.deb.sh
    dest: /tmp/infisical-cli-setup.deb.sh
    mode: "0700"
  when:
    - infisical_cli_version.rc != 0
    - ansible_facts.os_family | default('Debian') == "Debian"

- name: Configure Infisical CLI apt repository
  ansible.builtin.command:
    argv:
      - /tmp/infisical-cli-setup.deb.sh
  become: true
  when:
    - infisical_cli_version.rc != 0
    - ansible_facts.os_family | default('Debian') == "Debian"

- name: Install Infisical CLI package
  ansible.builtin.apt:
    name: infisical
    state: present
    update_cache: true
  become: true
  when:
    - infisical_cli_version.rc != 0
    - ansible_facts.os_family | default('Debian') == "Debian"

- name: Validate Infisical CLI installation
  ansible.builtin.command:
    argv:
      - infisical
      - --version
  changed_when: false
