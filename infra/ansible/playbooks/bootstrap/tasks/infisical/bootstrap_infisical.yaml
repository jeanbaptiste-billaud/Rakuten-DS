---
- name: Define Infisical bootstrap paths
  ansible.builtin.set_fact:
    infisical_project_root: "{{ project_root }}"
    infisical_bootstrap_state_dir: "{{ project_root }}"
    infisical_bootstrap_state_file: "{{ project_root }}/infisical-bootstrap.json"
    infisical_bootstrap_log_file: "{{ project_root }}/infisical-bootstrap.log"

- name: Build Infisical seed sources
  ansible.builtin.set_fact:
    infisical_seed_sources:
      - prefix: POSTGRES
        data: "{{ postgres | default({}) }}"
      # MinIO already stores Docker-compatible environment variable names.
      - prefix: ""
        data: "{{ minio | default({}) }}"
      - prefix: MINIO
        data: "{{ minio_service_accounts | default({}) }}"
      - prefix: MLFLOW
        data: "{{ mlflow | default({}) }}"
      - prefix: AIRFLOW
        data: "{{ airflow | default({}) }}"
      - prefix: DAGSHUB
        data: "{{ dagshub | default({}) }}"
      - prefix: GITHUB_APP
        data: "{{ github_app | default({}) }}"
  no_log: true

- name: Build Infisical runtime workload secrets
  ansible.builtin.set_fact:
    infisical_runtime_secrets: >-
      {{
        lookup(
          'ansible.builtin.template',
          infisical_project_root ~ '/infra/ansible/playbooks/bootstrap/tasks/infisical/templates/runtime_secrets.yaml.j2'
        ) | from_yaml | default([], true)
      }}
  no_log: true

- name: Build Infisical seed secrets
  ansible.builtin.set_fact:
    infisical_seed_secrets: >-
      {{
        lookup(
          'ansible.builtin.template',
          infisical_project_root ~ '/infra/ansible/playbooks/bootstrap/tasks/infisical/templates/seed_secrets.yaml.j2'
        ) | from_yaml | default([], true)
      }}
  no_log: true

- name: Ensure local Infisical state directory exists
  ansible.builtin.file:
    path: "{{ infisical_bootstrap_state_dir }}"
    state: directory
    mode: "0700"

- name: Check Infisical bootstrap state
  ansible.builtin.stat:
    path: "{{ infisical_bootstrap_state_file }}"
  register: infisical_bootstrap_state

- name: Load existing Infisical bootstrap state
  ansible.builtin.slurp:
    src: "{{ infisical_bootstrap_state_file }}"
  register: infisical_existing_bootstrap_state_content
  when: infisical_bootstrap_state.stat.exists
  no_log: true

- name: Parse existing Infisical bootstrap state
  ansible.builtin.set_fact:
    infisical_bootstrap_state_data: "{{ infisical_existing_bootstrap_state_content.content | b64decode | from_json }}"
  when: infisical_bootstrap_state.stat.exists
  no_log: true

- name: Bootstrap Infisical instance
  ansible.builtin.command:
    argv: "{{ infisical_cli_command + [
      'bootstrap',
      '--domain',
      infisical.site_url,
      '--email',
      infisical.bootstrap.admin_email,
      '--password',
      infisical.bootstrap.admin_password,
      '--organization',
      infisical.bootstrap.organization_name
    ] }}"
  register: infisical_bootstrap_result
  when: not infisical_bootstrap_state.stat.exists
  changed_when: infisical_bootstrap_result.rc == 0
  failed_when:
    - infisical_bootstrap_result.rc != 0
    - "'already been bootstrapped' not in (infisical_bootstrap_result.stderr | default(''))"
  no_log: true

# - name: Persist Infisical bootstrap log
#   ansible.builtin.copy:
#     dest: "{{ infisical_bootstrap_log_file }}"
#     content: >-
#       {{
#         [
#           'rc=' ~ (infisical_bootstrap_result.rc | default(-1) | string),
#           'stdout:',
#           infisical_bootstrap_result.stdout | default(''),
#           'stderr:',
#           infisical_bootstrap_result.stderr | default('')
#         ] | join('\n')
#       }}
#     mode: "0600"
#   when: not infisical_bootstrap_state.stat.exists
#   no_log: true

- name: Detect usable Infisical bootstrap output
  ansible.builtin.set_fact:
    infisical_bootstrap_has_json_output: >-
      {{
        infisical_bootstrap_result.rc == 0
        and
        (infisical_bootstrap_result.stdout | default('') | trim).startswith('{')
      }}
  when: not infisical_bootstrap_state.stat.exists
  no_log: true

- name: Parse Infisical bootstrap output
  ansible.builtin.set_fact:
    infisical_bootstrap_output: >-
      {{
        infisical_bootstrap_result.stdout
        | trim
        | from_json
      }}
    infisical_bootstrap_token: >-
      {{
        (
          infisical_bootstrap_result.stdout
          | trim
          | from_json
        ).identity.credentials.token
      }}
  when:
    - not infisical_bootstrap_state.stat.exists
    - infisical_bootstrap_has_json_output | default(false) | bool
  no_log: true

- name: Login to already bootstrapped Infisical instance
  ansible.builtin.uri:
    url: "{{ infisical.site_url }}/api/v3/login"
    method: POST
    headers:
      Content-Type: application/json
      User-Agent: ansible
    body_format: json
    body:
      email: "{{ infisical.bootstrap.admin_email }}"
      password: "{{ infisical.bootstrap.admin_password }}"
    return_content: true
    status_code: 200
  register: infisical_admin_login_response
  retries: 20
  delay: 3
  until: infisical_admin_login_response.status == 200
  when:
    - not infisical_bootstrap_state.stat.exists
    - infisical_bootstrap_token is not defined
  no_log: true

- name: Select Infisical admin access token
  ansible.builtin.set_fact:
    infisical_bootstrap_token: "{{ infisical_admin_login_response.json.accessToken }}"
    infisical_bootstrap_output:
      organization:
        id: ""
  when:
    - not infisical_bootstrap_state.stat.exists
    - infisical_bootstrap_token is not defined
  no_log: true

- name: Select existing Infisical bootstrap token
  ansible.builtin.set_fact:
    infisical_bootstrap_token: "{{ infisical_bootstrap_state_data.token }}"
  when: infisical_bootstrap_state.stat.exists
  no_log: true

- name: Persist Infisical bootstrap token state
  ansible.builtin.copy:
    dest: "{{ infisical_bootstrap_state_file }}"
    content: >-
      {{
        {
          'token': infisical_bootstrap_token,
          'bootstrap': infisical_bootstrap_output | default(infisical_bootstrap_state_data.bootstrap | default({}))
        } | to_nice_json
      }}
    mode: "0600"
  when:
    - not infisical_bootstrap_state.stat.exists
    - infisical_bootstrap_token is defined
  no_log: true

- name: Select existing Infisical project id
  ansible.builtin.set_fact:
    infisical_project_id: "{{ infisical_bootstrap_state_data.project_id }}"
  when:
    - infisical_bootstrap_state.stat.exists
    - infisical_bootstrap_state_data.project_id is defined
    - not (infisical_configure_with_terraform | default(true) | bool)
  no_log: true

- name: Select Infisical organization id
  ansible.builtin.set_fact:
    infisical_organization_id: >-
      {{
        infisical_bootstrap_state_data.organization_id
        | default(infisical_bootstrap_output.organization.id)
        | default(infisical_bootstrap_state_data.bootstrap.organization.id)
      }}
  when:
    - infisical_project_id is not defined or (infisical_configure_with_terraform | default(true) | bool)
  no_log: true

- name: Configure Infisical project and identities with Terraform
  ansible.builtin.include_tasks: configure_infisical_terraform.yaml
  when: infisical_configure_with_terraform | default(true) | bool

- name: Create Infisical project
  ansible.builtin.uri:
    url: "{{ infisical.site_url }}/api/v2/workspace/"
    method: POST
    headers:
      Authorization: "Bearer {{ infisical_bootstrap_token }}"
      Content-Type: application/json
    body_format: json
    body:
      projectName: "{{ infisical.bootstrap.project_name }}"
      shouldCreateDefaultEnvs: true
    return_content: true
    status_code:
      - 200
      - 201
  register: infisical_project_response
  when:
    - infisical_project_id is not defined
    - not (infisical_configure_with_terraform | default(true) | bool)
  no_log: true

- name: Select Infisical project id
  ansible.builtin.set_fact:
    infisical_project_id: "{{ infisical_project_response.json.project.id }}"
  when:
    - infisical_project_id is not defined
    - not (infisical_configure_with_terraform | default(true) | bool)
  no_log: true

- name: Persist Infisical project state
  ansible.builtin.copy:
    dest: "{{ infisical_bootstrap_state_file }}"
    content: >-
      {{
        {
          'token': infisical_bootstrap_token,
          'organization_id': infisical_organization_id | default(infisical_bootstrap_state_data.organization_id | default('')),
          'project_id': infisical_project_id,
          'bootstrap': infisical_bootstrap_output | default(infisical_bootstrap_state_data.bootstrap | default({}))
        } | to_nice_json
      }}
    mode: "0600"
  when: infisical_project_id is defined
  no_log: true

- name: Seed Ansible Vault secrets into Infisical
  ansible.builtin.command:
    argv: "{{ infisical_cli_command + [
      'secrets',
      'set',
      item.key ~ '=' ~ item.value,
      '--token',
      infisical_bootstrap_token,
      '--projectId',
      infisical_project_id,
      '--env',
      infisical.bootstrap.environment_slug,
      '--domain',
      infisical.site_url,
      '--path',
      item.path | default(infisical.bootstrap.secret_path)
    ] }}"
  loop: "{{ infisical_seed_secrets + infisical_runtime_secrets }}"
  when: item.value | string | length > 0
  no_log: true
