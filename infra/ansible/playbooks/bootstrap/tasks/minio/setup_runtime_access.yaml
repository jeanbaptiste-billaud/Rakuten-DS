---
- name: Ensure temporary MinIO policy directory exists
  ansible.builtin.file:
    path: "{{ minio_policy_tmp_dir | default('/tmp/rakuten-minio-policies') }}"
    state: directory
    mode: "0700"

- name: Write MinIO runtime policies
  ansible.builtin.copy:
    dest: "{{ minio_policy_tmp_dir | default('/tmp/rakuten-minio-policies') }}/{{ item.policy_name }}.json"
    content: "{{ item.policy | to_nice_json }}\n"
    mode: "0600"
  loop: "{{ minio_runtime_accounts }}"
  no_log: true

- name: Create MinIO runtime users and attach policies
  containers.podman.podman_container:
    name: "minio-runtime-access-{{ item.name }}"
    image: "{{ docker_images['minio-client'].image }}"
    rm: true
    recreate: true
    detach: false
    network: "{{ docker_network }}"
    volumes:
      - "{{ minio_policy_tmp_dir | default('/tmp/rakuten-minio-policies') }}:/policies:ro"
    env:
      MINIO_ROOT_USER: "{{ minio.MINIO_ROOT_USER }}"
      MINIO_ROOT_PASSWORD: "{{ minio.MINIO_ROOT_PASSWORD }}"
      MINIO_ACCESS_KEY: "{{ item.access_key }}"
      MINIO_SECRET_KEY: "{{ item.secret_key }}"
      MINIO_POLICY_NAME: "{{ item.policy_name }}"
    entrypoint:
      - /bin/sh
      - -lc
    command: |
      set -e
      mc alias set local http://minio:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"
      mc admin user add local "$MINIO_ACCESS_KEY" "$MINIO_SECRET_KEY" || true
      mc admin policy create local "$MINIO_POLICY_NAME" "/policies/${MINIO_POLICY_NAME}.json" || true
      mc admin policy attach local "$MINIO_POLICY_NAME" --user "$MINIO_ACCESS_KEY"
  loop: "{{ minio_runtime_accounts }}"
  no_log: true
