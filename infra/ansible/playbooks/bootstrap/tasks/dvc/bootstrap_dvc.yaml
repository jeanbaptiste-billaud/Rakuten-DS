---
- name: Check if DVC repo exists
  ansible.builtin.stat:
    path: "{{ volume_mountpoints.dvc }}/.git"
  register: dvc_repo

- name: Clone DVC repository
  containers.podman.podman_container:
    name: dvc
    image: "{{ docker_images.dvc.image }}"
    rm: true
    recreate: true
    detach: false
    workdir: "{{ bootstrap_repo_dir }}"
    volumes:
      - "{{ docker_volumes.dvc }}:{{ bootstrap_repo_dir }}"
    command: "git clone --branch {{ repo_branch }} --single-branch {{ repo_url }} ."
  when: not dvc_repo.stat.exists

- name: Configure Dagshub remote credentials
  containers.podman.podman_container:
    image: "{{ docker_images.dvc.image }}"
    name: dvc
    rm: true
    recreate: true
    detach: false
    workdir: "{{ bootstrap_repo_dir }}"
    volumes:
      - "{{ docker_volumes.dvc }}:{{ bootstrap_repo_dir }}"
    command:
      - sh
      - -c
      - |
        set -e

        dvc remote modify origin --local auth basic
        dvc remote modify origin --local user "{{ dagshub.user }}"
        dvc remote modify origin --local password "{{ dagshub.password }}"
  no_log: true

- name: Inspect DVC branch tracking list
  ansible.builtin.stat:
    path: "{{ volume_mountpoints.dvc }}/.dvc/dvc_tracking_list.yaml"
  register: dvc_branch_tracking_list

- name: Inspect controller fallback tracking list
  ansible.builtin.stat:
    path: "{{ playbook_dir }}/../../../../.dvc/dvc_tracking_list.yaml"
  register: dvc_fallback_tracking_list

- name: Require a DVC tracking list
  ansible.builtin.assert:
    that:
      - dvc_branch_tracking_list.stat.exists or dvc_fallback_tracking_list.stat.exists
    fail_msg: >-
      dvc_tracking_list.yaml is absent from both the cloned DVC branch and the
      Ansible controller repository.

- name: Select DVC tracking list source
  ansible.builtin.set_fact:
    dvc_tracking_list_file: >-
      {{ volume_mountpoints.dvc ~ '/.dvc/dvc_tracking_list.yaml'
         if dvc_branch_tracking_list.stat.exists
         else playbook_dir ~ '/../../../../.dvc/dvc_tracking_list.yaml' }}

- name: Report DVC tracking list fallback
  ansible.builtin.debug:
    msg: >-
      The cloned {{ repo_branch }} branch does not contain dvc_tracking_list.yaml;
      using the controller repository copy for this bootstrap run.
  when: not dvc_branch_tracking_list.stat.exists

- name: Load DVC tracking list
  ansible.builtin.include_vars:
    file: "{{ dvc_tracking_list_file }}"

- name: Pull DVC tracked data
  containers.podman.podman_container:
    name: dvc
    image: "{{ docker_images.dvc.image }}"
    rm: true
    recreate: true
    detach: false
    workdir: "{{ bootstrap_repo_dir }}"
    volumes:
      - "{{ docker_volumes.dvc }}:{{ bootstrap_repo_dir }}"
    command:
      - sh
      - -c
      - "dvc pull {{ item }}"
  loop: "{{ dvc_targets }}"

- name: Remove local DVC config file
  containers.podman.podman_container:
    image: "{{ docker_images.dvc.image }}"
    name: dvc
    rm: true
    recreate: true
    detach: false
    workdir: "{{ bootstrap_repo_dir }}"
    volumes:
      - "{{ docker_volumes.dvc }}:{{ bootstrap_repo_dir }}"
    command:
      - sh
      - -c
      - rm -f .dvc/config.local
