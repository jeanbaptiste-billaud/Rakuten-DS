#bootstrap.yml
#│
#├── postgres
#│   ├── start postgres
#│   ├── restore databases
#│   └── validate restore
#│
#├── minio
#│   ├── create buckets
#│   ├── create users
#│   └── upload initial datasets
#│
#└── validation
#    ├── healthchecks
#    └── smoke tests
---

- name: Bootstrap Rakuten environment
  hosts: deploy
  gather_facts: true

  vars:
    repo_name: Rakuten-DS
    repo_branch: dvc
    repo_url: https://github.com/jeanbaptiste-billaud/Rakuten-DS.git
    bootstrap_repo_dir: "{{ workdir }}/dvc_data"
    bootstrap_logs_mount: "{{ workdir }}/logs_and_reports"
    bootstrap_minio_image: "minio/minio:RELEASE.2025-09-07T16-13-09Z"
    bootstrap_minio_health_url: "http://127.0.0.1:9000/minio/health/live"
    bootstrap_postgres_dumps:
      - name: airflow
        db: "{{ postgres.airflow.db }}"
      - name: mlflow
        db: "{{ postgres.mlflow.db }}"

  tasks:
    - name: Create podman volumes
      ansible.builtin.include_tasks:
        file: tasks/podman_volume.yaml
        apply:
          tags: [init]
      tags: [init]

    - name: Create Podman network
      containers.podman.podman_network:
        name: "{{ docker_network }}"
        state: present
        disable_dns: false
      tags: [init]

    - name: Bootstrap DVC data
      ansible.builtin.include_tasks: tasks/dvc/bootstrap_dvc.yaml

    - name: Extract logs and reports archive
      containers.podman.podman_container:
        image: "{{ docker_images.dvc.image }}"
        name: dvc
        rm: true
        recreate: true
        detach: false
        workdir: "{{ bootstrap_repo_dir }}"
        volumes:
          - "{{ docker_volumes.dvc }}:{{ bootstrap_repo_dir }}"
          - "{{ docker_volumes.logs }}:{{ bootstrap_logs_mount }}"
        command:
          - sh
          - -c
          - "tar -xzf data/logs_and_reports.tar.gz -C {{ workdir }}"

    - name: Restore Postgres databases
      ansible.builtin.include_tasks: tasks/postgres/bootstrap_postgres.yaml

    - name: Initialize MinIO
      ansible.builtin.include_tasks: tasks/minio/bootstrap_minio.yaml

    - name: Setup MinIO runtime access
      ansible.builtin.include_tasks: tasks/minio/bootstrap_runtime_access.yaml
