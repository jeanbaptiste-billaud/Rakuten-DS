---
- name: Check Terraform CLI
  ansible.builtin.command:
    argv:
      - terraform
      - --version
  register: terraform_cli_version
  changed_when: false
  failed_when: false

- name: Install Terraform apt prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present
    update_cache: true
    lock_timeout: 120
  become: true
  when:
    - terraform_cli_version.rc != 0
    - ansible_facts.os_family | default('Debian') == "Debian"

- name: Download HashiCorp signing key
  ansible.builtin.get_url:
    url: https://apt.releases.hashicorp.com/gpg
    dest: /tmp/hashicorp-archive-keyring.gpg
    mode: "0644"
  when:
    - terraform_cli_version.rc != 0
    - ansible_facts.os_family | default('Debian') == "Debian"

- name: Install HashiCorp apt keyring
  ansible.builtin.command:
    argv:
      - gpg
      - --dearmor
      - --yes
      - --output
      - /usr/share/keyrings/hashicorp-archive-keyring.gpg
      - /tmp/hashicorp-archive-keyring.gpg
    creates: /usr/share/keyrings/hashicorp-archive-keyring.gpg
  become: true
  when:
    - terraform_cli_version.rc != 0
    - ansible_facts.os_family | default('Debian') == "Debian"

- name: Select HashiCorp apt architecture
  ansible.builtin.set_fact:
    terraform_apt_arch: >-
      {{ 'amd64' if ansible_facts.architecture in ['x86_64', 'amd64']
      else 'arm64' if ansible_facts.architecture in ['aarch64', 'arm64']
      else ansible_facts.architecture }}
  when:
    - terraform_cli_version.rc != 0
    - ansible_facts.os_family | default('Debian') == "Debian"

- name: Add HashiCorp apt repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch={{ terraform_apt_arch | default('amd64') }} signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg]
      https://apt.releases.hashicorp.com {{ ansible_facts.distribution_release | lower }} main
    state: present
    filename: hashicorp
    update_cache: true
  become: true
  when:
    - terraform_cli_version.rc != 0
    - ansible_facts.os_family | default('Debian') == "Debian"

- name: Install Terraform package
  ansible.builtin.apt:
    name: terraform
    state: present
    update_cache: true
    lock_timeout: 120
  register: terraform_package_install
  become: true
  when:
    - terraform_cli_version.rc != 0
    - ansible_facts.os_family | default('Debian') == "Debian"

- name: Validate Terraform installation
  ansible.builtin.command:
    argv:
      - terraform
      - --version
  changed_when: false
  when:
    - terraform_cli_version.rc == 0
      or (terraform_package_install is defined and not (terraform_package_install.skipped | default(false)))
