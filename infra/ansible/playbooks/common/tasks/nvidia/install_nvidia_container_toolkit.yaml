# infra/ansible/tasks/install_nvidia_container_toolkit.yaml
---
- name: Install NVIDIA Container Toolkit packages
  hosts: all
  become: true
  gather_facts: true

  vars:
    nvidia_container_toolkit_version: "1.19.1-1"

  tasks:

    #######################################################################
    # Debian / Ubuntu
    #######################################################################

    - name: Install NVIDIA Container Toolkit packages on Debian/Ubuntu
      when: ansible_facts['os_family'] == "Debian"
      block:

        - name: Install NVIDIA repository prerequisites
          ansible.builtin.apt:
            name:
              - ca-certificates
              - curl
              - gnupg2
            state: present
            update_cache: true
            install_recommends: false

        - name: Download NVIDIA GPG key
          ansible.builtin.get_url:
            url: https://nvidia.github.io/libnvidia-container/gpgkey
            dest: /tmp/nvidia-container-toolkit.asc
            mode: '0644'

        - name: Convert NVIDIA GPG key to APT keyring format
          ansible.builtin.command:
            cmd: >
              gpg --dearmor
              -o /usr/share/keyrings/nvidia-container-toolkit-keyring.gpg
              /tmp/nvidia-container-toolkit.asc
          args:
            creates: /usr/share/keyrings/nvidia-container-toolkit-keyring.gpg

        - name: Download NVIDIA APT repository list
          ansible.builtin.get_url:
            url: https://nvidia.github.io/libnvidia-container/stable/deb/nvidia-container-toolkit.list
            dest: /tmp/nvidia-container-toolkit.list
            mode: '0644'

        - name: Add signed-by option to NVIDIA APT repository
          ansible.builtin.replace:
            path: /tmp/nvidia-container-toolkit.list
            regexp: '^deb https://'
            replace: 'deb [signed-by=/usr/share/keyrings/nvidia-container-toolkit-keyring.gpg] https://'

        - name: Install NVIDIA APT repository file
          ansible.builtin.copy:
            src: /tmp/nvidia-container-toolkit.list
            dest: /etc/apt/sources.list.d/nvidia-container-toolkit.list
            remote_src: true
            mode: '0644'

        - name: Update APT cache after adding NVIDIA repository
          ansible.builtin.apt:
            update_cache: true

        - name: Install versioned NVIDIA Container Toolkit packages
          ansible.builtin.apt:
            name:
              - "nvidia-container-toolkit={{ nvidia_container_toolkit_version }}"
              - "nvidia-container-toolkit-base={{ nvidia_container_toolkit_version }}"
              - "libnvidia-container-tools={{ nvidia_container_toolkit_version }}"
              - "libnvidia-container1={{ nvidia_container_toolkit_version }}"
            state: present
            install_recommends: false

    #######################################################################
    # RHEL / Rocky / AlmaLinux / CentOS / Fedora / Amazon Linux
    #######################################################################

    - name: Install NVIDIA Container Toolkit packages on RedHat family
      when: ansible_facts['os_family'] == "RedHat"
      block:

        - name: Install NVIDIA repository prerequisites
          ansible.builtin.dnf:
            name:
              - curl
            state: present
            update_cache: true

        - name: Install NVIDIA YUM/DNF repository file
          ansible.builtin.get_url:
            url: https://nvidia.github.io/libnvidia-container/stable/rpm/nvidia-container-toolkit.repo
            dest: /etc/yum.repos.d/nvidia-container-toolkit.repo
            mode: '0644'

        - name: Install versioned NVIDIA Container Toolkit packages
          ansible.builtin.dnf:
            name:
              - "nvidia-container-toolkit-{{ nvidia_container_toolkit_version }}"
              - "nvidia-container-toolkit-base-{{ nvidia_container_toolkit_version }}"
              - "libnvidia-container-tools-{{ nvidia_container_toolkit_version }}"
              - "libnvidia-container1-{{ nvidia_container_toolkit_version }}"
            state: present

    #######################################################################
    # OpenSUSE / SLE
    #######################################################################

    - name: Install NVIDIA Container Toolkit packages on SUSE
      when: ansible_facts['os_family'] == "Suse"
      block:

        - name: Add NVIDIA zypper repository
          community.general.zypper_repository:
            name: nvidia-container-toolkit
            repo: https://nvidia.github.io/libnvidia-container/stable/rpm/nvidia-container-toolkit.repo
            state: present
            auto_import_keys: true

        - name: Refresh zypper repositories
          community.general.zypper:
            update_cache: true

        - name: Install versioned NVIDIA Container Toolkit packages
          community.general.zypper:
            name:
              - "nvidia-container-toolkit-{{ nvidia_container_toolkit_version }}"
              - "nvidia-container-toolkit-base-{{ nvidia_container_toolkit_version }}"
              - "libnvidia-container-tools-{{ nvidia_container_toolkit_version }}"
              - "libnvidia-container1-{{ nvidia_container_toolkit_version }}"
            state: present