# infra/ansible/playbooks/install_pixi.yml
---

- name: Install local softwares
  hosts: all
  gather_facts: true

  tasks:
    - name: Install Podman
      ansible.builtin.apt:
        name:
          - podman
        state: present
        update_cache: true
        install_recommends: false

    - name: Install snap
      ansible.builtin.include_tasks: tasks/utils/install_snap.yaml

    - name: Install Bitwarden CLI
      community.general.snap:
        name: bw
        state: present