#bootstrap.yml
#│
#├── dvc
#│   ├── clone repository
#│   ├── configure remote
#│   └── dvc pull
#│
#├── postgres
#│   ├── start postgres
#│   ├── restore databases
#│   └── validate restore
#│
#├── minio
#│   ├── create buckets
#│   ├── create users
#│   └── upload initial datasets
#│
#└── validation
#    ├── healthchecks
#    └── smoke tests
---

- name: Bootstrap Rakuten environment
  hosts: all
  gather_facts: true

  vars:
    repo_name: Rakuten-DS
    repo_branch: dvc
    repo_url: "https://github.com/jeanbaptiste-billaud/Rakuten-DS.git"

  tasks:
    - name: Create podman container volumes
      containers.podman.podman_volume:
        name: "{{ item }}"
        recreate: false
      loop:
        - pgdata
        - minio_data
        - dvc_data

    - name: dvc
      block:
        - name: clone repository
          containers.podman.podman_container:
            name: dvc
            image: "{{ docker_images.dvc.image }}"
            rm: true
            recreate: true
            detach: false
            workdir: "{{ workdir }}/dvc_data"
            volumes:
              - "dvc_data:{{ workdir }}/dvc_data"
            command: git clone --branch "{{ repo_branch }}" --single-branch "{{ repo_url }}"

