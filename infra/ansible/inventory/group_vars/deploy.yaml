---
docker_images:
  api-gateway:
    image: "{{ docker_repository }}:api-gateway-latest"
  auth-service:
    image: "{{ docker_repository }}:auth-service-latest"
  bentoml:
    image: "{{ docker_repository }}:bentoml-latest"
  drift-detector:
    image: "{{ docker_repository }}:drift-detector-latest"
  dvc:
    image: "{{ docker_repository }}:dvc-latest"
  minio-client:
    image: "{{ docker_repository }}:minio-client-latest"
  mlflow:
    image: "{{ docker_repository }}:mlflow-latest"
  spacy:
    image: "{{ docker_repository }}:spacy-latest"
  trainer:
    image: "{{ docker_repository }}:trainer-latest"
  streamlit:
    image: "{{ docker_repository }}:streamlit-latest"
  airflow:
    image: "{{ docker_repository }}:airflow-latest"
  postgres-backup:
    image: "{{ docker_repository }}:postgres-backup-latest"
  postgres:
    image: dhi.io/postgres:17
  spire-server:
    image: dhi.io/spire-server:1.15.1
  spire-agent:
    image: dhi.io/spire-agent:1.15.1
  redis:
    image: docker.io/library/redis:7-alpine
  infisical:
    image: docker.io/infisical/infisical:latest-postgres
  spire_server:
    image: dhi.io/spire-server:1.15
  spire_agent:
    image: dhi.io/spire-agent:1

workdir: "/app"

spire:
  trust_domain: rakuten.local
  server_port: 8081
  bundle_endpoint_port: 8443
  bundle_refresh_hint: 1h
  bundle_dns_name: spire-server
  tls_dir: "{{ ansible_facts.env.HOME }}/.config/rakuten/spire/tls"
  server_uid: 65532
  server_gid: 65532
  agent_spiffe_id: spiffe://rakuten.local/agent/rakuten-host
  config_dir: "{{ ansible_facts.env.HOME }}/.config/rakuten/spire"
  socket_path: /run/spire/sockets/agent.sock
  podman_socket_host: "/run/user/{{ ansible_facts.user_uid }}/podman/podman.sock"
  podman_socket_container: /run/podman/podman.sock
  workloads:
    - data-ingestion
    - data-enrichment
    - data-preprocessing
    - training
    - model-evaluation
    - model-build
    - backup
    - postgres-backup
    - dvc-publisher
