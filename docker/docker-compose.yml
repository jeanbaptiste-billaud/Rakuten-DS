services:
  minio: # ne pas modifier le nom
    image: minio/minio:${MINIO_VERSION}
    container_name: minio-S3-storage
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${MINIO_PORT}/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio-client: # ne pas modifier le nom
    build:
      context: ..
      dockerfile: docker/minio-client/Dockerfile
      args:
        - VERSION=${MC_VERSION}
    image: minio-client:${MC_VERSION}
    container_name: minio-client
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      MINIO_MLFLOW_BUCKET: ${MINIO_MLFLOW_BUCKET}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_HOST: ${MINIO_HOST}
      MINIO_PORT: ${MINIO_PORT}
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - ../data:/mnt/data
      - ../docker/minio-client/mc-config:/config
    command: "/src/minio_init.sh > /proc/1/fd/1 2>&1 ; tail -f /dev/null"
    tty: true

  # =========================================================
  # 🧠 Base de donnée de MLflow + restauration
  # =========================================================
  postgres: # ne pas modifier le nom
    image: postgres:15
    container_name: mlflow-database
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - mlflow_db:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  # =========================================================
  # 🧠 MLflow Tracking Server (UI + REST API)
  # =========================================================
  mlflow-server:
    build:
      context: ..
      dockerfile: docker/mlflow/Dockerfile
      args:
        - VERSION=${MLFLOW_VERSION}
    image: mlflow:${MLFLOW_VERSION}
    container_name: mlflow-server
    env_file:
      - ${ENV_FILE_PATH:-.env}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "5000:5000"
    environment:
      # --- tracking backend ---
      MLFLOW_BACKEND_STORE_URI: "${MLFLOW_BACKEND_STORE_URI}"
      # --- Configuration serveur d’artefacts ---
      MLFLOW_ARTIFACT_URI: "http://mlflow-artifacts:5000"
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      MLFLOW_S3_ENDPOINT_URL: http://${MINIO_HOST}:${MINIO_PORT}
      # --- configuration de MLflow ---
      MLFLOW_HOST: "${MLFLOW_HOST}"
      MLFLOW_PORT: "${MLFLOW_PORT}"
    command: >
      mlflow server
      --backend-store-uri ${MLFLOW_BACKEND_STORE_URI}
      --host ${MLFLOW_HOST}
      --port ${MLFLOW_PORT}
      --default-artifact-root s3://${MINIO_MLFLOW_BUCKET}/
      --allowed-hosts "localhost, *"

  # =========================================================
  # 📦 MLflow Artifact Server (S3/MinIO backend)
  # =========================================================
#  mlflow-artifacts:
#    <<: *mlflow-common
#    container_name: mlflow-artifacts
#    depends_on:
#      <<: *mlflow-common-depends-on
#    ports:
#      - "5001:5000"  # port interne 5000, exposé en 5001 sur ta machine
#    environment:
#      <<: *mlflow-common-env
#    command: >
#      mlflow server
#        --artifacts-only
#        --host ${MLFLOW_HOST}
#        --port ${MLFLOW_PORT}
#        --artifacts-destination s3://${MINIO_MLFLOW_BUCKET}/

  # ========================================
  # 🆕 SERVICE DRIFT DETECTOR
  # ========================================
  drift-detector:
    build:
      context: drift-detector
    image: evidently:v0.4.33
    container_name: drift-detector
    ports:
      - "8003:8003"
    volumes:
      - ../drift_reports:/app/drift_reports
      - ../logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 30s
      timeout: 10s
      retries: 3


  # =====================================================================
  # 🟦 PROMETHEUS (Monitoring)
  # =====================================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: rakuten-prometheus
    volumes:
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    depends_on:
      - mlflow-server
      - data
    networks:
      - default

  # =====================================================================
  # 🟩 GRAFANA (Dashboards)
  # =====================================================================
  grafana:
    image: grafana/grafana:latest
    container_name: rakuten-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_AUTH_DISABLE_LOGIN_FORM=true
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    volumes:
      - ../monitoring/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
    networks:
      - default

  # =====================================================================
  # 🛠️ MODEL-BUILDER (API de prédiction)
  # =====================================================================
  model-builder:
    build:
      context: ..
      dockerfile: docker/bentoml/Dockerfile
    image: model-builder:latest
    container_name: model-builder
    volumes:
      - /var/run/docker.sock.raw:/var/run/docker.sock
    environment:
      - PYTHONUNBUFFERED=1
      - AWS_ACCESS_KEY_ID=${MINIO_ROOT_USER}
      - AWS_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD}
      - MLFLOW_S3_ENDPOINT_URL=http://${MINIO_HOST}:${MINIO_PORT}
      - MLFLOW_TRACKING_URI=http://mlflow-server:${MLFLOW_PORT}
      - MLFLOW_S3_ENDPOINT_URL=http://${MINIO_HOST}:${MINIO_PORT}
      - MLFLOW_RUN_ID=1ae0352ce67c41dab8cad9adbc0f656f
    depends_on:
      - mlflow-server
      - minio
    networks:
      - default
    command: tail -f /dev/null  # pour garder le conteneur en vie
    tty: true


#  # =====================================================================
#  # 🟦 MODEL-SERVING (API de prédiction)
#  # =====================================================================
#  model-serving:
#    build:
#      context: ..
#      dockerfile: bentoml/Dockerfile
#    image: model-serving:latest
#    container_name: model-serving
#    ports:
#      - "8002:8002"
#    volumes:
#      - ../models:/app/models:ro
#      - ../logs:/app/logs
#    environment:
#      - PYTHONUNBUFFERED=1
#    depends_on:
#      - data
#    restart: unless-stopped
#    networks:
#      - default


  # =====================================================================
  # 🟧 API GATEWAY (point d'entrée – orchestrateur des services)
  # =====================================================================
  api-gateway:
    build:
      context: ..
      dockerfile: docker/api-gateway/Dockerfile
    image: api-gateway:latest
    container_name: api-gateway
    ports:
      - "8000:8000"
    environment:
      - PREPROCESSING_SERVICE_URL=http://data:8001
      - MODEL_SERVICE_URL=http://model-serving_provisoire:8002
    depends_on:
      - data
#      - model-serving
    restart: unless-stopped
    networks:
      - default


  airflow-init:
    image: apache/airflow:2.7.1
    container_name: airflow-init
    depends_on:
      - postgres
    environment:
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres/postgres
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
    command: version
    entrypoint: >
      /bin/bash -c "
      airflow db init &&
      airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com
      "

  airflow-webserver:
    image: apache/airflow:2.7.1
    container_name: airflow-webserver
    restart: always
    depends_on:
      - airflow-init
      - postgres
    user: "${AIRFLOW_UID}:0"
    group_add:
      - "${AIRFLOW_GID}"
    ports:
      - "8080:8080"
    environment:
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres/postgres
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    volumes:
      - ../dags:/opt/airflow/dags
      - ../logs/airflow:/opt/airflow/logs
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    command: webserver

  airflow-scheduler:
    image: apache/airflow:2.7.1
    container_name: airflow-scheduler
    restart: always
    depends_on:
      - airflow-init
      - postgres
    user: "${AIRFLOW_UID}:0"
    group_add:
      - "${AIRFLOW_GID}"
    environment:
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres/postgres
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
    volumes:
      - ../dags:/opt/airflow/dags
      - ../logs/airflow:/opt/airflow/logs
      - /var/run/docker.sock:/var/run/docker.sock
    command: scheduler

# ===============================================================
#  SERVICES à extraire du compose et à appeler via un dag aiflow
# ===============================================================

  # ========================================
  # SERVICE TRAINING (avec drift detection)
  # ========================================
  trainer:
    build:
      context: ..
      dockerfile: docker/trainer/Dockerfile
      args:
        - WORKING_DIR=${WORKDIR}
    image: sklearn:v1.7.2
    container_name: rakuten-model_trainer
    user: "1000:1000"
    working_dir: ${WORKDIR}
#    volumes:
#      - ../src:/src
#      - ../data:/data
#      - ../models:${WORKDIR}/models
    environment:
      - WORKDIR=${WORKDIR}
      - PYTHONUNBUFFERED=1
      - MLFLOW_TRACKING_URI=http://mlflow-server:${MLFLOW_PORT}
      - MLFLOW_S3_ENDPOINT_URL=http://${MINIO_HOST}:${MINIO_PORT}
      - AWS_ACCESS_KEY_ID=${MINIO_ROOT_USER}
      - AWS_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD}
      - DRIFT_DETECTOR_URL=http://drift-detector:8003
      - GIT_PYTHON_REFRESH=quiet
    depends_on:
      - mlflow-server
      - drift-detector
    command: tail -f /dev/null  # pour garder le conteneur en vie
    tty: true

  # ========================================
  # SERVICE data (preprocessing etc.)
  # ========================================
  data:
    build:
      context: ..
      dockerfile: docker/data/Dockerfile
      args:
        - WORKING_DIR=${WORKDIR}
    image: spacy:3.7.5
    container_name: data
    user: "1000:1000"
    working_dir: ${WORKDIR}
    environment:
      - WORKDIR=${WORKDIR}
      - PYTHONUNBUFFERED=1
      - MINIO_HOST=${MINIO_HOST}
      - MINIO_PORT=${MINIO_PORT}
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD}
    command: tail -f /dev/null  # pour garder le conteneur en vie
    tty: true

networks:
  default:
    name: mlflow-network

volumes:
  logs:
  drift_reports:
  mlflow_db:
    name: mlflow_db
  minio_data:
    name: minio_data
