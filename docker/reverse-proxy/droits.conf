server {
    listen 80;

    # 📦 Type par défaut pour TOUTES les réponses
    default_type application/json;

    # 🔒 Par défaut : tout est interdit
    location / {
        return 403 '{"error":"Accès interdit"}';
    }

    # 🔐 AUTH ENDPOINT (interne)
    location = /auth {
        internal;
        proxy_pass http://auth-service:8000/check;
        proxy_set_header token $http_token;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
    }

    # 👤 USER + ADMIN → /predict
    location /predict {
        # ❌ Mauvaise méthode HTTP
        if ($request_method != POST) {
            return 405 '{"error":"Méthode non autorisée. Utilisez POST."}';
        }

        auth_request /auth;
        auth_request_set $user_role $upstream_http_x_user_role;

        error_page 401 = @auth_401;
        error_page 403 = @auth_403;

        proxy_pass http://model-serving:8002/predict;
    }

    # 👑 ADMIN ONLY
    location /admin {
        auth_request /auth;
        auth_request_set $user_role $upstream_http_x_user_role;

        if ($user_role != "admin") {
            return 403 '{"error":"Accès réservé aux administrateurs"}';
        }

        proxy_pass http://drift-detector:8003/admin;
    }

    # ❤️ HEALTH (public)
    location /health {
        proxy_pass http://drift-detector:8003/health;
    }

    # ❌ ERREURS AUTH (pas de default_type ici)
    location @auth_401 {
        return 401 '{"error":"Authentification requise"}';
    }

    location @auth_403 {
        return 403 '{"error":"Accès refusé : token invalide ou droits insuffisants"}';
    }
}
