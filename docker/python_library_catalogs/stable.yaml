metadata:
  source: Generated from docker/*/requirements.txt and docker/docker-images-build.sh
  version_policy: single_catalog_version_per_library

catalog:
  conda:
    antlr4-python3-runtime: ==4.9.3
    spacy-model-fr_core_news_sm: "*"
    git: ==2.54.0

  pypi:
    bentoml: ==1.4.33
    boto3: ==1.42.29
    dvc:
      version: ==3.66.1
      extras:
      - s3
    evidently: ==0.7.20
    fastapi: ==0.128.0
    httpx: ==0.28.1
    joblib: ==1.5.3
    markdown: ==3.5.1
    minio: ==7.2.20
    mlflow:
      version: ==3.9.0
      extras:
#        - extras
      - db
    numpy: ==2.2.6
    pandas: ==2.3.3
    matplotlib: ==3.10.8
    omegaconf: ==2.3.0
    optuna: ==4.7.0
    pathspec: <1
    plotly: ==5.18.0
    prometheus-client: ==0.24.1
    pydantic: ==2.12.5
    pyyaml: ==6.0.3
    pytest: ==8.4.2
    pytest-asyncio: ==1.2.0
    pytest-mock: ==3.15.1
    requests: ==2.34.2
    scikit-learn: ==1.8.0
    seaborn: ==0.13.2
    spiffe: ==0.3.0
    spacy: ==3.8.11
    fr-core-news-sm: ==3.8.0
    streamlit: ==1.29.0
    streamlit-option-menu: ==0.3.6
    tqdm: ==4.70.0
    uvicorn:
      version: ==0.40.0
      extras:
      - standard

features:
  api-gateway:
    pypi:
    - fastapi
    - uvicorn
    - pydantic
    - httpx
    - prometheus-client
  auth-service:
    pypi:
    - fastapi
    - uvicorn
  bentoml:
    conda:
#      - spacy-model-fr_core_news_sm
    pypi:
    - fastapi
    - uvicorn
    - pydantic
    - joblib
    - bentoml
    - mlflow
    - prometheus-client
    - boto3
    - spacy
  drift-detector:
    pypi:
    - fastapi
    - uvicorn
    - pydantic
    - pandas
    - evidently
    - httpx
  dvc:
    conda:
      - git
      - antlr4-python3-runtime
    pypi:
    - fastapi
    - uvicorn
    - pydantic
    - minio
    - prometheus-client
    - dvc
    - pathspec
  minio-client:
    pypi:
    - minio
  mlflow:
    pypi:
    - mlflow
    - boto3
  spacy:
    conda:
#    - spacy-model-fr_core_news_sm
    pypi:
    - fastapi
    - uvicorn
    - pydantic
    - spacy
    - minio
    - prometheus-client
    - pandas
  trainer:
    conda:
      - git
    pypi:
    - fastapi
    - uvicorn
    - pydantic
    - pandas
    - scikit-learn
    - joblib
    - mlflow
    - minio
    - boto3
  streamlit:
    pypi:
    - streamlit
    - streamlit-option-menu
    - pandas
    - plotly
    - requests
    - markdown
  airflow:
    pypi: []
  reverse-proxy:
    pypi: []
  security:
    pypi:
    - spiffe
  test_infra:
    pypi:
    - pytest
    - pytest-asyncio
    - pytest-mock
    - fastapi
    - httpx
    - pandas
    - evidently
    - minio
    - prometheus-client
    - spiffe
  test_image:
    pypi:
    - pytest
    - pytest-mock
    - pandas
    - scikit-learn
    - omegaconf
    - pyyaml
  test_text:
    pypi:
    - pytest
    - pytest-asyncio
    - pytest-mock
    - pandas
    - scikit-learn
    - joblib
    - omegaconf
    - optuna
    - pyyaml
    - matplotlib
    - seaborn
    - spacy
    - fr-core-news-sm
    - tqdm
    - mlflow
    - requests
    - plotly

environments:
  api-gateway:
  - api-gateway
  auth-service:
  - auth-service
  bentoml:
  - bentoml
  - security
  drift-detector:
  - drift-detector
  dvc:
  - dvc
  - security
  minio-client:
  - security
  - minio-client
  mlflow:
  - mlflow
  spacy:
  - spacy
  - security
  trainer:
  - trainer
  - security
  postgres-backup:
  - security
  streamlit:
  - streamlit
  airflow:
  - airflow
  reverse-proxy:
  - reverse-proxy
  test-infra:
  - test_infra
  test-image:
  - test_image
  test-text:
  - test_text
  pixi:
    []

images:
  repository: "docker.io/jbbillaud/rakuten"
  api-gateway:
    dockerfile: api-gateway/Dockerfile
    pixi-env: api-gateway
  auth-service:
    dockerfile: auth-service/Dockerfile
    pixi-env: auth-service
  bentoml:
    dockerfile: bentoml/Dockerfile
    pixi-env: bentoml
  drift-detector:
    dockerfile: drift-detector/Dockerfile
    pixi-env: drift-detector
  dvc:
    dockerfile: dvc/Dockerfile
    pixi-env: dvc
  minio-client:
    dockerfile: minio-client/Dockerfile
    pixi-env: minio-client
  mlflow:
    dockerfile: mlflow/Dockerfile
    pixi-env: mlflow
  spacy:
    dockerfile: spacy/Dockerfile
    pixi-env: spacy
  postgres-backup:
    dockerfile: postgres-backup/Dockerfile
    pixi-env: postgres-backup
  trainer:
    dockerfile: trainer/Dockerfile
    pixi-env: trainer
  streamlit:
    dockerfile: streamlit/Dockerfile
    pixi-env: streamlit
  airflow:
    dockerfile: airflow/Dockerfile
    pixi-env: airflow
  reverse-proxy:
    dockerfile: reverse-proxy/Dockerfile
    pixi-env: reverse-proxy
  pixi:
    dockerfile: pixi/Dockerfile
    pixi-env: pixi
